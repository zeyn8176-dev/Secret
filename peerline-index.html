<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Peerline</title>
    <style>
      :root {
        --bg: #f3f4f4;
        --surface: #fff;
        --soft: #f0f2f2;
        --line: #dde1e2;
        --text: #252a2d;
        --muted: #687175;
        --accent: #496565;
        --tint: #e9efef;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #151819;
          --surface: #1d2123;
          --soft: #262b2d;
          --line: #343a3d;
          --text: #eceff0;
          --muted: #9aa3a7;
          --accent: #8fb3b3;
          --tint: #243030;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #151819;
        --surface: #1d2123;
        --soft: #262b2d;
        --line: #343a3d;
        --text: #eceff0;
        --muted: #9aa3a7;
        --accent: #8fb3b3;
        --tint: #243030;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      body {
        max-width: 480px;
        margin: 0 auto;
        min-height: 100vh;
        background: var(--bg);
        display: flex;
        flex-direction: column;
      }
      header {
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        height: 60px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
      }
      header b {
        flex: 1;
        font-size: 19px;
      }
      header small {
        color: var(--muted);
        font-size: 12px;
      }
      .back {
        background: none;
        border: 0;
        color: var(--text);
        display: none;
        padding: 0;
        cursor: pointer;
      }
      main {
        flex: 1;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
      }
      .sub {
        color: var(--muted);
      }
      .cap {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .btn {
        height: 48px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        font: 600 14px inherit;
        font-family: inherit;
        cursor: pointer;
        width: 100%;
        padding: 0 16px;
      }
      .btn.p {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--surface);
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .row > * {
        min-width: 0;
      }
      .grow {
        flex: 1;
      }
      .av {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--soft);
        display: grid;
        place-items: center;
        font: 600 13px inherit;
        font-family: inherit;
        flex: none;
        border: 0;
        color: var(--text);
      }
      .nm {
        font-weight: 600;
      }
      .mt {
        color: var(--muted);
        font-size: 12px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-weight: 600;
        font-size: 13px;
      }
      input {
        min-height: 48px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: 400 14px inherit;
        font-family: inherit;
        width: 100%;
      }
      .pw {
        position: relative;
        display: flex;
      }
      .pw input {
        padding-right: 64px;
      }
      .pw .eye {
        position: absolute;
        top: 4px;
        right: 4px;
        bottom: 4px;
        min-width: 56px;
        padding: 0 10px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--accent);
        font: 600 12px inherit;
        font-family: inherit;
        cursor: pointer;
      }
      .pw .eye:hover {
        background: var(--soft);
      }
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        min-height: 44px;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--soft);
        color: var(--text);
        font: 12px inherit;
        font-family: inherit;
        cursor: pointer;
      }
      .chip.on {
        background: var(--tint);
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 600;
      }
      .tabs {
        display: flex;
        gap: 12px;
      }
      .tab {
        flex: 1;
        white-space: nowrap;
        padding: 0 8px;
        height: 44px;
        background: none;
        border: 0;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font: 13px inherit;
        font-family: inherit;
        cursor: pointer;
      }
      .tab.on {
        border-bottom: 2px solid var(--accent);
        color: var(--accent);
        font-weight: 600;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        width: 100%;
        background: none;
        border: 0;
        color: var(--text);
        text-align: left;
        font-family: inherit;
        cursor: pointer;
        font-size: 14px;
      }
      .nav > div {
        flex: 1;
      }
      .hr {
        height: 1px;
        background: var(--line);
      }
      svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      nav.bar {
        position: sticky;
        bottom: 0;
        background: var(--surface);
        border-top: 1px solid var(--line);
        display: flex;
        padding: 12px 8px calc(12px + env(safe-area-inset-bottom, 0px));
        gap: 2px;
      }
      nav.bar button {
        flex: 1;
        background: none;
        border: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font: 10px inherit;
        font-family: inherit;
        cursor: pointer;
      }
      nav.bar button.on {
        color: var(--accent);
        font-weight: 600;
      }
      .file {
        background: var(--soft);
        border-radius: 6px;
        padding: 12px;
        display: flex;
        gap: 10px;
      }
      .act {
        background: none;
        border: 0;
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--text);
        font: 13px inherit;
        font-family: inherit;
        cursor: pointer;
        flex: 1;
        padding: 0;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
      }
      .msgs {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .b {
        max-width: 80%;
        padding: 12px;
        border-radius: 10px;
        background: var(--surface);
        border: 1px solid var(--line);
      }
      .b.me {
        align-self: flex-end;
        background: var(--accent);
        color: var(--surface);
        border-color: var(--accent);
      }
      .act.on svg {
        fill: currentColor;
      }
      .cm {
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      select,
      textarea {
        min-height: 48px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        width: 100%;
      }
      textarea {
        resize: vertical;
      }
      /* Motion: press feedback, pings and entrance animations */
      .btn,
      .chip,
      .tab,
      .act,
      .nav,
      .av,
      .eye,
      nav.bar button,
      [role="switch"] {
        transition:
          transform 0.12s ease,
          background-color 0.2s ease,
          border-color 0.2s ease,
          color 0.2s ease,
          box-shadow 0.2s ease;
      }
      .btn:active,
      .chip:active,
      .av:active,
      .eye:active,
      [role="switch"]:active {
        transform: scale(0.97);
      }
      .tab:active,
      .act:active,
      nav.bar button:active {
        transform: scale(0.94);
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .chip:hover,
      .tab:hover {
        color: var(--accent);
      }
      .act {
        border-radius: 6px;
      }
      @keyframes pl-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pl-ping {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent);
        }
        100% {
          box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 0%, transparent);
        }
      }
      @keyframes pl-flash {
        from {
          background-color: var(--tint);
        }
      }
      @keyframes pl-pop {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.4);
        }
        65% {
          transform: scale(0.9);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes pl-shake {
        20%,
        60% {
          transform: translateX(-4px);
        }
        40%,
        80% {
          transform: translateX(4px);
        }
      }
      @keyframes pl-dot {
        75%,
        100% {
          transform: scale(2.6);
          opacity: 0;
        }
      }
      main.enter > * {
        animation: pl-in 0.3s ease-out both;
      }
      main.enter > :nth-child(2) {
        animation-delay: 0.04s;
      }
      main.enter > :nth-child(3) {
        animation-delay: 0.08s;
      }
      main.enter > :nth-child(4) {
        animation-delay: 0.12s;
      }
      main.enter > :nth-child(n + 5) {
        animation-delay: 0.16s;
      }
      .fresh {
        animation: pl-in 0.3s ease-out both;
      }
      .btn.ping,
      .chip.ping,
      .av.ping,
      [role="switch"].ping {
        animation: pl-ping 0.5s ease-out;
      }
      .tab.ping,
      .act.ping,
      .nav.ping {
        animation: pl-flash 0.5s ease-out;
      }
      .pop {
        animation: pl-pop 0.45s ease-out;
      }
      .shake {
        animation: pl-shake 0.35s ease-in-out;
      }
      .dot {
        position: relative;
        flex: none;
      }
      .dot::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: var(--accent);
        animation: pl-dot 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>

    <script>
      const I = {

<div class="card"><label>Share something<input id="np" placeholder="What are you working on?"></label><button class="btn p" data-newpost>Post</button></div>
<label>Search posts or people<input id="fq" value="${e(S.q)}" placeholder="⌕  Search"></label>
<div class="chips">${["All", "Research", "Accessibility", "Design systems"].map((x) => `<button class="chip ${x === f ? "on" : ""}" data-chip="${x}">${x}</button>`).join("")}</div>
${

}
${L.map(pst).join("") || '<p class="sub">No posts match your filters.</p>'}`;

        },

              );
            }).join("") || '<p class="sub">Nothing here yet.</p>'
          }</div>
<button class="btn p" data-go="contacts">New message</button><p class="mt">Select a conversation to read and reply.</p>`;
        },
        chat: () => {

${c.st === "blocked" ? '<p class="sub">You blocked this contact. Unblock to send messages.</p>' : '<div class="card"><label>Message<input id="m" placeholder="Write a reply…"></label><button class="btn p" data-send>Send message</button></div>'}`;
        },
        profile: () => {
          const mine = S.P.filter((p) => p.me);
          return `<div class="card">${person(ini(), e(A.name), e(A.prof))}<p class="mt" style="font-size:13px">@${A.username} · ${e(A.email)}</p><p>${e(A.bio) || '<span class="sub">Add a short description so peers know your work.</span>'}</p><b>0 connections · ${mine.length} posts</b><button class="btn p" data-go="editprofile">Edit profile</button></div>
<h1>Offered skills</h1><div class="chips">${A.skills.map((k) => `<span class="chip" style="display:flex;align-items:center">${k}</span>`).join("") || '<p class="sub">No skills selected yet.</p>'}</div>
<div class="card"><div class="nm">Certifications</div>${A.certs.map((c, i) => (i ? '<div class="hr"></div>' : "") + `<div class="row"><div class="grow"><div class="nm">${e(c.n)}</div><div class="mt">PDF · ${c.s}</div></div>${ic("file")}</div>`).join("") || '<p class="sub">No certifications uploaded yet.</p>'}</div>
<div class="card"><div class="nm">Quick navigation</div><div class="row"><button class="btn" data-go="feed">Feed</button><button class="btn" data-go="contacts">Find Contacts</button></div><button class="btn" data-go="messages">Messages</button></div>
<div><div class="nm">Posts</div><div class="mt">${mine.length} shared with your professional circle</div></div><button class="btn" data-manage>${S.manage ? "Done managing" : "Manage posts"}</button>${mine.map(pst).join("") || '<p class="sub">You haven’t shared any posts yet.</p>'}`;
        },
      };
      const NAV = [
        ["dashboard", "grid", "Dashboard"],
        ["feed", "home", "Feed"],
        ["contacts", "users", "Find Contacts"],
        ["messages", "msg", "Messages"],

      function draw(keep) {
        const r = location.hash.slice(1) || "login";
        let k = R[r] ? r : "login";
        if (!A && !["login", "register"].includes(k)) k = "login";
        if (A && A.mustChange && k !== "settings") k = "settings";
        const moved = k !== S.k;
        if (moved) {
          S.F = {};
          S.pw = {};
          S.err = "";
          S.done = 0;
          S.n = 3;
          if (A && k === "editprofile")
            S.d = {
              prof: A.prof,
              bio: A.bio || "",
              skills: [...A.skills],
              certs: [...A.certs],

              email: A.email,
              notif: A.notif,
              theme: A.theme,
              vis: A.vis,
            };
          S.k = k;
          if (k === "admin" && isAdmin()) loadAdmin();

        applyTheme(
          k === "settings" && S.g ? S.g.theme : A ? A.theme : "System",

          (A && CFG.ann && !["login", "register"].includes(k)
            ? `<div class="card" style="background:var(--tint);border-color:var(--accent)"><p class="cap">Announcement</p><p>${e(CFG.ann)}</p></div>`

        $("#ctx").style.display = au ? "none" : "";

            register: "Registration",
            editprofile: "Edit profile",
            settings: "Settings",
            profile: "Profile",
            admin: "Admin panel",

          "register",
          "contacts",
          "chat",
          "profile",
          "editprofile",
          "settings",
          "admin",
        ].includes(k)
          ? "block"
          : "none";
        $("#back").innerHTML = ic("left");

          ([id, i, t]) =>
            `<button class="${id === k || (k === "chat" && id === "messages") ? "on" : ""}" data-go="${id}">${ic(i)}${t}</button>`,
        ).join("");

        S.le = S.err;
        if (S.done && !S.ld) document.querySelectorAll(".note").forEach((n) => fx(n, "fresh"));
        S.ld = S.done;
        const q = S.fx || [];
        S.fx = [];
        q.forEach((f) => f());

      const go = (h) =>
        location.hash === "#" + h ? draw() : (location.hash = h);
      document.addEventListener("click", (x) => {
        const t = x.target.closest("button");

          P = (id) => S.P.find((p) => p.id === id);

          x.preventDefault();
          const i = document.getElementById(d.pw),
            v = i.type === "password";

        const sel = Object.keys(d).length
          ? "button" +
            Object.keys(d)
              .map(
                (k) =>
                  `[data-${k.replace(/[A-Z]/g, (m) => "-" + m.toLowerCase())}="${CSS.escape(d[k])}"]`,

          : "";

        if (t.id === "back") return history.back();
        if (d.chat !== undefined) {
          S.cur = +d.chat;
          return go("chat");

        if (d.tab) S.tab = d.tab;
        if (d.chip) S.f = d.chip;
        if (d.mtab) S.mt = d.mtab;
        if (d.like) {

        if (d.cm) {

            S.fx.push(() =>
              $("#c-" + d.cm)
                ?.closest(".card")
                .querySelectorAll(".cm, label, [data-addcm]")
                .forEach((n) => fx(n, "fresh")),
            );
        }
        if (d.rep) {
          S.rep = S.rep === d.rep ? "" : d.rep;
          if (S.rep)
            S.fx.push(() => fx($(sel)?.closest(".card").querySelector(".chips"), "fresh"));

        if (d.at) S.at = d.at;

          const i = $("#c-" + d.addcm),

              const l = $("#c-" + d.addcm)?.closest(".card").querySelectorAll(".cm");
              if (l && l.length) fx(l[l.length - 1], "fresh");

        if (d.del) {
          S.P = S.P.filter((p) => p.id !== d.del);

        if ("manage" in d) S.manage = !S.manage;
        if ("follow" in d) S.follow = !S.follow;
        if (d.ctab) {
          S.ct = d.ctab;
          S.n = 3;

              x: v,
              l: 0,
              cm: [],

            kv.put("posts/" + p.id, p);

        }
        if (d.st) {
          const c = S.C[S.cur];
          c.st = c.st === d.st ? "" : d.st;
        }
        if ("send" in d) {
          const v = $("#m").value.trim();
          if (v) {
            const c = S.C[S.cur];
            c.m.push(["me", v]);
            c.tm = "Now";
            S.fx.push(() => fx($(".msgs .b:last-child"), "fresh"));
          }
        }
        if (d.toast) return alert(d.toast);
        draw(1);
      });
      document.addEventListener("input", (x) => {
        const f0 = x.target.dataset.f;

          S.F[f0] = x.target.value;

          if (S.d && f0 === "bio") {
            S.d.bio = x.target.value;
            $("#cnt").textContent = x.target.value.length + " / 300 characters";
          }
          if (S.g && f0 === "ge") S.g.email = x.target.value;
          return;
        }
        const k = { fq: "q", mq: "mq", cq: "cq", aq: "aq" }[x.target.id];
        if (!k) return;
        S[k] = x.target.value;
        draw(1);
        const i = $("#" + x.target.id);
        i.focus();
        i.setSelectionRange(i.value.length, i.value.length);
      });

        if (x.key === "Enter" && x.target.id === "m") $("[data-send]").click();

        const t = x.target;
        if (t.id === "cf") {
          const f = t.files[0];
          if (f && S.d && S.d.certs.length < 5) {
            S.d.certs.push({
              n: f.name,
              s: (f.size / 1048576).toFixed(1) + " MB",
            });
            draw(1);
          }
          t.value = "";
          return;
        }
        if (t.id === "ep" && S.d) S.d.prof = t.value;
        if (t.id === "pf") {
          S.pf = t.value;
          S.n = 3;
          draw(1);
        }
        if (t.dataset.f !== undefined) S.F[t.dataset.f] = t.value;
      });
      document.addEventListener("focusout", (x) => {
        const i = x.target.dataset && x.target.dataset.f;
        if (i) {
          S.T = S.T || {};
          S.T[i] = 1;
          vl();
        }
      });
      document.addEventListener("keyup", (x) => {
        if (x.target.id === "lp") {
          S.caps = !!(x.getModifierState && x.getModifierState("CapsLock"));
          vl();
        }
      });
      addEventListener("hashchange", () => draw());
      (async () => {
        try {
          if (window.claude)
            DB = await Promise.race([
              claude.use("db"),
              new Promise((r) => setTimeout(() => r(null), 2500)),
            ]);
        } catch {}
        try {
          await seedAdmin();
        } catch {}
        try {
          const u = sessionStorage.getItem("pl:s");
          if (u) {
            const x = await acct.get(u);
            if (x && !x.suspended) {
              await claim(x);
              signIn(x);
              await loadShared();
            }
          }
        } catch {}
        draw();
      })();
